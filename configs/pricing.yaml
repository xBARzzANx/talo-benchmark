# Model pricing — USD per 1,000,000 tokens
#
# Public list prices at the time of experimentation (May 2026).
# Used for the cost analysis in Sections 4.5.3 and 6.4.
#
# VERIFICATION: run `python verify_pricing.py` to recompute the Phase 1 costs
# from the stored token counts and compare them against the figures reported
# in Section 4.5.3. If the computed values deviate, adjust the prices here --
# the figures already published in Chapter 4 are the reference.
#
# NOTE ON MODEL IDs: the key `claude-sonnet-4-6` is a legacy identifier used
# throughout the stored result files. The model actually invoked was
# claude-sonnet-4-5-20250929. Do not rename the key; use the label field for
# display.

currency: USD
unit: per_million_tokens

models:
  gpt-4.1-mini:
    label: "GPT-4.1-mini"
    input: 0.40
    output: 1.60
    provider: openai

  claude-haiku-4-5:
    label: "Claude Haiku 4.5"
    input: 1.00
    output: 5.00
    provider: anthropic

  gemini-2.5-flash:
    label: "Gemini 2.5 Flash"
    input: 0.15
    output: 0.60
    provider: google

  claude-sonnet-4-6:
    label: "Claude Sonnet 4.5"
    input: 3.00
    output: 15.00
    provider: anthropic
    note: >
      Legacy key. Actual model invoked was claude-sonnet-4-5-20250929.
      Gold standard reference and LLM-as-Judge, not a ranked benchmark
      participant.

  llama-3.1-8b:
    label: "Llama 3.1 8B"
    input: 0.00
    output: 0.00
    provider: ollama
    note: "Local inference via Ollama. No API cost."

  mistral-7b:
    label: "Mistral 7B Instruct"
    input: 0.00
    output: 0.00
    provider: ollama
    note: "Local inference via Ollama. No API cost."

# Figures reported in Section 4.5.3 of the thesis, used as the verification
# target by verify_pricing.py. Phase 1 only, 360 calls total.
reported_phase1_costs:
  total: 0.54
  by_model:
    claude-sonnet-4-6: 0.36
    claude-haiku-4-5: 0.11
    gemini-2.5-flash: 0.04
    gpt-4.1-mini: 0.02
  tolerance: 0.01
